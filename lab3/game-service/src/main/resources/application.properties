spring.application.name=game-service
server.port=${PORT:8082}

# JSON uses snake_case like the communication contract
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=true

# JWT - must be identical to the Player Service secret so the Game Service can
# validate the tokens the Player Service signs.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32chars!!}

management.endpoints.web.exposure.include=health

# --- Lab 3: logs (every line shows the gateway's request id) ---
logging.pattern.level=%5p [%X{requestId:-}]
