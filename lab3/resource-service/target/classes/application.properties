spring.application.name=resource-service
server.port=8082

# --- Database (PostgreSQL) ---
# The ${...} values are read from environment variables.
# docker compose sets them from your .env file, so no password is written here.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# "update" creates the tables on the first start and KEEPS the data on later starts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JSON ---
# Java field roomId <-> JSON field room_id
spring.jackson.property-naming-strategy=SNAKE_CASE
# Unknown JSON fields are rejected with 400 instead of being silently ignored.
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- Lab 3: logs and Service Discovery ---
# Every log line shows the request id the gateway gave the request: INFO [9f1c-...] --> GET /api/...
logging.pattern.level=%5p [%X{requestId:-}]
# Where to register (in Docker: http://service-discovery:8761). Empty = don't register (laptop, tests).
service-discovery.url=${SERVICE_DISCOVERY_URL:}
service-discovery.heartbeat-seconds=10
