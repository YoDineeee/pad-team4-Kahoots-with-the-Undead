spring.application.name=player-service
server.port=${PORT:8081}

# Every JSON field is written/read in snake_case (playerId <-> "player_id"),
# exactly like in the communication contract. No @JsonProperty needed on each field.
spring.jackson.property-naming-strategy=SNAKE_CASE
# Don't write "null" fields in responses
spring.jackson.default-property-inclusion=non_null

# JWT settings. The secret comes from an environment variable so it is never committed.
# The default is ONLY for local development (must be at least 32 characters for HS256).
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32chars!!}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

management.endpoints.web.exposure.include=health

# --- Lab 3: logs and Service Discovery ---
# Every log line shows the request id the gateway gave the request: INFO [9f1c-...] --> GET /api/...
logging.pattern.level=%5p [%X{requestId:-}]
# Where to register (in Docker: http://service-discovery:8761). Empty = don't register (laptop, tests).
service-discovery.url=${SERVICE_DISCOVERY_URL:}
service-discovery.heartbeat-seconds=10
